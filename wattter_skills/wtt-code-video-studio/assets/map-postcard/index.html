<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>季节地图明信片</title><style>body{margin:0;background:#FDFDF9;display:grid;place-items:center;color:#4d6170;font:14px system-ui}canvas{width:min(96vw,86vh);height:auto}section{display:flex;align-items:center;gap:12px;padding:8px}input{width:min(65vw,720px)}button{border:1px solid #b3c9bf;border-radius:6px;background:#fffdf0;padding:6px 18px}#status{font-size:12px;min-height:1.4em}</style></head><body><canvas id="stage" width="1080" height="1080"></canvas><section><button id="play" disabled>播放</button><input id="seek" aria-label="帧" type="range" min="0" max="599" value="0"><span id="time"></span></section><p id="status">加载地图配置…</p><script src="presentation.js"></script><script src="legacy-scroll.js"></script><script src="world.js"></script><script src="map.js"></script><script>
'use strict';const seek=document.querySelector('#seek'),button=document.querySelector('#play'),status=document.querySelector('#status');let n=0,playing=false,raf=0;
fetch('config.json').then(r=>{if(!r.ok)throw Error('config.json HTTP '+r.status);return r.json();}).then(config=>{const map=MapPostcard.make(document.querySelector('canvas'),config);window.__map=map;const N=map.config.frames,FPS=map.config.fps;seek.max=N-1;window.__filmMeta={width:1080,height:1080,fps:FPS,totalFrames:N};
function pause(){playing=false;cancelAnimationFrame(raf);button.textContent='播放';}
window.frame=i=>{map.frame(i);n=((i%N)+N)%N;seek.value=n;document.querySelector('#time').textContent=(n/FPS).toFixed(1)+'s';};window.pause=pause;
window.play=()=>{if(playing)return;playing=true;button.textContent='暂停';const start=performance.now()-n/FPS*1000;function tick(t){if(!playing)return;frame(Math.floor((t-start)/1000*FPS)%N);raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);};
seek.oninput=()=>{pause();frame(Number(seek.value));};button.onclick=()=>playing?pause():play();frame(0);button.disabled=false;status.textContent=map.config.viewProfile+' · '+map.config.palette+' · '+map.config.durationSeconds+'秒 / '+FPS+'fps循环';window.renderFrame=async i=>frame(i);window.__ready=true;
}).catch(error=>{status.textContent='加载失败：'+error.message;window.__error=error.message;console.error(error);});
</script></body></html>
