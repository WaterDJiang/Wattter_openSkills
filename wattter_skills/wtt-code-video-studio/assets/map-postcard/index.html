<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>季节地图明信片</title><style>body{margin:0;background:#FDFDF9;display:grid;place-items:center}canvas{width:min(96vw,90vh);height:auto}input{width:75vw;max-width:900px}</style><canvas id="stage" width="1080" height="1080"></canvas><input id="seek" aria-label="帧" type="range" min="0" max="599" value="0"><script src="map.js"></script><script>fetch('config.json').then(r=>r.json()).then(config=>{const map=MapPostcard.make(document.querySelector('canvas'),config);window.frame=i=>map.frame(i);let n=0;frame(0);const seek=document.querySelector('#seek');seek.oninput=()=>{n=+seek.value;frame(n)};window.play=()=>{let start=performance.now()-n/30*1000;function tick(t){n=Math.floor((t-start)/1000*30)%600;seek.value=n;frame(n);requestAnimationFrame(tick)}requestAnimationFrame(tick)};window.__ready=true;});</script></html>
