<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限流口 · 手动探索</title><style>body{margin:0;padding:24px;background:#edf3ef;color:#173a42;font:18px system-ui}main{max-width:960px;margin:auto}canvas{width:100%;height:auto}label{display:block;margin:20px 0}input{width:70%;vertical-align:middle}button{padding:10px 20px;border-radius:8px;border:1px solid #46786d;background:white}p{line-height:1.8}</style><main><canvas id="stage" width="960" height="540" aria-label="输入3个每秒，限流口处理1个每秒的动画示意"></canvas><label>查看时刻 <input id="time" type="range" min="0" max="7.95" step="0.05" value="0"><output id="clock">0.00秒</output></label><button id="reset">回到开始</button><p id="state" aria-live="polite"></p><p>拖动或用键盘方向键探索。同一份状态模型驱动视频画面和下方读数；这里是确定性教学示意，不是随机排队系统仿真。输入大于处理能力，等待便会增加。</p></main><script src="../scenes.js"></script><script>const stage=document.querySelector('#stage'),slider=document.querySelector('#time');function update(){const t=Number(slider.value),s=window.sampleModels.queueAt(t);window.drawScene(stage.getContext('2d'),{scene:{id:'knowledge'},time:t,width:960,height:540});document.querySelector('#clock').value=t.toFixed(2)+'秒';document.querySelector('#state').textContent=`已到达 ${s.arrivals} 个，已处理 ${s.departures} 个，尚待处理 ${s.queue} 个。`;}slider.addEventListener('input',update);document.querySelector('#reset').onclick=()=>{slider.value=0;update();};document.fonts.ready.then(update);</script></html>
