<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晚风来信 · 确定性Canvas预览</title><style>*{box-sizing:border-box}body{margin:0;background:#173c37;color:#f3e7c6;font:15px system-ui}main{max-width:1280px;margin:auto;padding:24px}canvas,video{display:block;width:100%;height:auto;background:#50786a}h1{font-size:23px;font-weight:500}section{display:flex;align-items:center;gap:14px;margin:14px 0}input{flex:1}button{background:#e1b968;border:0;border-radius:7px;padding:9px 20px;color:#334b3d;cursor:pointer}p{opacity:.75;font-size:13px}a{color:inherit}</style></head><body><main><h1>晚风来信</h1><canvas id="stage" width="1920" height="1080"></canvas><section><button id="play" disabled>播放</button><input id="seek" type="range" min="0" max="359" value="0" step="1" aria-label="选择帧"><span id="time">加载中</span></section><p id="status">正在生成固定种子的背景画层…</p><p>画面代码预览 · 原创角色与音乐 · <a href="final.mp4">成片MP4</a> · <a href="HANDPAINTED.md">运行说明</a></p><audio id="audio" src="audio/mix-master.wav" preload="metadata"></audio></main><script src="forest.js"></script><script src="courier.js"></script><script src="scene.js"></script><script>
'use strict';const $=x=>document.getElementById(x);let movie,playing=false;
function draw(i){movie.frame(i);$('seek').value=i;$('time').textContent=`${(i/30).toFixed(2)} / 12.00秒`;}
function stop(){playing=false;$('audio').pause();$('play').textContent='播放';}
function tick(){if(!playing)return;let i=Math.min(359,Math.floor($('audio').currentTime*30));draw(i);if(i>=359)stop();else requestAnimationFrame(tick);}
try{movie=Handpainted.make($('stage'));draw(0);$('play').disabled=false;$('status').textContent='就绪 · 播放、暂停与选帧使用同一个 frame(i)；声音来自最终混音。';}catch(e){$('status').textContent='初始化失败：'+e.message;throw e;}
$('play').onclick=async()=>{if(playing){stop();return;}if($('audio').currentTime>=11.95)$('audio').currentTime=0;try{await $('audio').play();playing=true;$('play').textContent='暂停';tick();}catch(e){$('status').textContent='音频播放失败：'+e.message;}};
$('seek').oninput=()=>{stop();$('audio').currentTime=Number($('seek').value)/30;draw(Number($('seek').value));};$('audio').onended=stop;
</script></body></html>
