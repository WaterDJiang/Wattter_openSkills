    <circle cx="722" cy="414" r="132" fill="#1F90E0" fill-opacity="0.9"/>
    <text x="530" y="398" text-anchor="middle" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="26" font-weight="700">{{COL_A_TITLE}}</text>
    <text x="530" y="440" text-anchor="middle" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="18">BEFORE</text>
    <text x="750" y="398" text-anchor="middle" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="26" font-weight="700">{{COL_B_TITLE}}</text>
    <text x="750" y="440" text-anchor="middle" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="18">AFTER</text>
    <text x="640" y="422" text-anchor="middle" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">VS</text>
    <text x="380" y="425" text-anchor="middle" fill="#2E75FF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="38">‹</text>
    <text x="900" y="425" text-anchor="middle" fill="#1F90E0" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="38">›</text>
