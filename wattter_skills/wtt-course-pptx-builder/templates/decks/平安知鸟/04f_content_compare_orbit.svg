    <text x="950" y="318" fill="#262626" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_B_01}}</text>
    <line x1="950" y1="338" x2="1208" y2="338" stroke="#1F90E0" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="950" y="392" fill="#1F90E0" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">{{COL_B_LABEL_02}}</text>
    <text x="950" y="424" fill="#262626" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_B_02}}</text>
    <line x1="950" y1="444" x2="1208" y2="444" stroke="#1F90E0" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="950" y="498" fill="#1F90E0" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">{{COL_B_LABEL_03}}</text>
    <text x="950" y="530" fill="#262626" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_B_03}}</text>
