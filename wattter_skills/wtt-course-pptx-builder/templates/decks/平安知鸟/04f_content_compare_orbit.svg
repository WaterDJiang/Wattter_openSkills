<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="bg-compare-orbit">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <path d="M 390 720 C 310 580 304 412 388 240 C 444 126 534 44 650 0 L 650 720 Z" fill="#ECF6FE"/>
    <path d="M 650 720 L 650 0 C 770 54 856 140 908 256 C 982 420 970 578 888 720 Z" fill="#F1F8FE"/>
    <circle cx="650" cy="420" r="286" fill="none" stroke="#2E75FF" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <g id="compare-orbit-header">
    <rect x="58" y="40" width="6" height="30" fill="#C7A661"/>
