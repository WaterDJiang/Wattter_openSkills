    <image href="logo_white.png" x="1061" y="22" width="187" height="51" preserveAspectRatio="xMidYMid meet"/>
    <text x="70" y="142" fill="#262626" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="52" font-weight="800">{{PAGE_TITLE}}</text>
    <line x1="70" y1="176" x2="1210" y2="176" stroke="#E7E6E6" stroke-width="1"/>
  </g>

  <g id="compare-orbit-left-points">
    <text x="72" y="286" fill="#003396" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">{{COL_A_LABEL_01}}</text>
    <text x="72" y="318" fill="#44546A" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_A_01}}</text>
    <line x1="72" y1="338" x2="330" y2="338" stroke="#2E75FF" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="72" y="392" fill="#003396" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">{{COL_A_LABEL_02}}</text>
    <text x="72" y="424" fill="#44546A" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_A_02}}</text>
    <line x1="72" y1="444" x2="330" y2="444" stroke="#2E75FF" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="72" y="498" fill="#003396" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="20" font-weight="700">{{COL_A_LABEL_03}}</text>
    <text x="72" y="530" fill="#44546A" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="22">{{COL_A_03}}</text>
