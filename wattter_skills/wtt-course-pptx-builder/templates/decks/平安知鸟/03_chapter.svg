<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="chapterBlue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#003396"/>
      <stop offset="100%" stop-color="#2E75FF"/>
    </linearGradient>
  </defs>

  <g id="bg-chapter-classic">
    <rect x="0" y="0" width="1280" height="720" fill="url(#chapterBlue)"/>
    <path d="M 0 0 L 286 0 C 244 116 252 238 302 356 C 354 478 346 600 286 720 L 0 720 Z" fill="#FFFFFF"/>
    <path d="M 288 0 C 246 116 254 238 304 356 C 356 478 348 600 288 720" fill="none" stroke="#C7A661" stroke-width="7"/>
    <circle cx="1110" cy="600" r="210" fill="#FFFFFF" fill-opacity="0.05"/>
    <circle cx="1110" cy="600" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <g id="chapter-logo">
    <image href="logo_white.png" x="1061" y="24" width="187" height="51" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="chapter-number">
    <text x="70" y="354" fill="#003396" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="140" font-weight="800">{{CHAPTER_NUMBER}}</text>
    <rect x="72" y="390" width="92" height="5" fill="#C7A661"/>
    <text x="72" y="440" fill="#44546A" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="24" font-weight="700">{{SECTION_LABEL}}</text>
  </g>

  <g id="chapter-title">
    <text x="390" y="250" fill="#C7A661" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="24" font-weight="700" letter-spacing="5">CHAPTER</text>
    <text x="388" y="372" fill="#FFFFFF" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="84" font-weight="800">{{CHAPTER_TITLE}}</text>
    <line x1="390" y1="418" x2="920" y2="418" stroke="#FFFFFF" stroke-opacity="0.36" stroke-width="1"/>
    <text x="390" y="470" fill="#ECF6FE" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="30">{{CHAPTER_SUBTITLE}}</text>
  </g>

  <g id="chapter-footer">
    <text x="390" y="650" fill="#FFFFFF" fill-opacity="0.62" font-family="&quot;STKaiti&quot;, &quot;KaiTi&quot;" font-size="16" letter-spacing="3">PINGAN ZHINIAO · LEARNING ENABLEMENT</text>
  </g>
</svg>
