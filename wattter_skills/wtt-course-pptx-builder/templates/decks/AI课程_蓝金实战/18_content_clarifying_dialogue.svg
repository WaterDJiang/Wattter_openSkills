<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#003396"/>
  <g id="title" font-family="Hiragino Sans GB">
    <rect x="64" y="49" width="30" height="4" fill="#C7A661"/>
    <text x="106" y="59" font-size="22" font-weight="700" fill="#ECF6FE" data-text-width="370">{{SECTION_LABEL}}</text>
    <text x="62" y="145" font-size="55" font-weight="800" fill="#FFFFFF" data-text-width="1150">{{PAGE_TITLE}}</text>
  </g>
  <g id="learner-prompt" font-family="Hiragino Sans GB">
    <rect x="64" y="238" width="4" height="263" fill="#C7A661"/>
    <text x="89" y="262" font-size="24" font-weight="700" fill="#ECF6FE" data-text-width="427">{{USER_LABEL}}</text>
    <text x="89" y="333" font-size="39" font-weight="700" fill="#FFFFFF" data-text-width="507">{{USER_LINE_01}}</text>
    <text x="89" y="392" font-size="39" font-weight="700" fill="#FFFFFF" data-text-width="507">{{USER_LINE_02}}</text>
    <text x="89" y="451" font-size="39" font-weight="700" fill="#FFFFFF" data-text-width="507">{{USER_LINE_03}}</text>
  </g>
  <g id="dialogue-direction">
    <path d="M 555 364 H 636 M 623 352 L 637 364 L 623 376" fill="none" stroke="#C7A661" stroke-width="3"/>
  </g>
  <g id="assistant-questions" font-family="Hiragino Sans GB">
    <rect x="663" y="207" width="553" height="333" rx="8" fill="#FFFFFF"/>
    <text x="693" y="257" font-size="24" font-weight="700" fill="#003396" data-text-width="468">{{AI_LABEL}}</text>
    <line x1="693" y1="278" x2="1185" y2="278" stroke="#E7E6E6" stroke-width="2"/>
    <text x="693" y="337" font-size="23" font-weight="800" fill="#003396" data-text-width="46">01</text>
    <text x="750" y="340" font-size="33" fill="#262626" data-text-width="415">{{QUESTION_01}}</text>
    <text x="693" y="407" font-size="23" font-weight="800" fill="#003396" data-text-width="46">02</text>
    <text x="750" y="410" font-size="33" fill="#262626" data-text-width="415">{{QUESTION_02}}</text>
    <text x="693" y="477" font-size="23" font-weight="800" fill="#003396" data-text-width="46">03</text>
    <text x="750" y="480" font-size="33" fill="#262626" data-text-width="415">{{QUESTION_03}}</text>
  </g>
  <g id="takeaway" font-family="Hiragino Sans GB">
    <line x1="64" y1="599" x2="1216" y2="599" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="65" y="659" font-size="32" font-weight="700" fill="#FFFFFF" data-text-width="1130">{{NEXT_ACTION}}</text>
  </g>
</svg>
