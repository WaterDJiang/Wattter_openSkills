    <text x="170" y="459" text-anchor="middle" fill="#FFFFFF" font-family="STKaiti, KaiTi" font-size="20" font-weight="800">02</text>
    <text x="218" y="459" fill="#1F90E0" font-family="STKaiti, KaiTi" font-size="22" font-weight="700">{{TIME_2}}</text>
    <text x="356" y="459" fill="#262626" font-family="STKaiti, KaiTi" font-size="22">{{ACTION_2}}</text>
