<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="595" width="1280" height="125" fill="#ECF6FE"/>
  <rect x="58" y="40" width="6" height="30" fill="#C7A661"/>
  <text x="80" y="65" fill="#003396" font-family="STKaiti, KaiTi" font-size="24" font-weight="700">{{SECTION_LABEL}}</text>
  <text x="70" y="142" fill="#262626" font-family="STKaiti, KaiTi" font-size="52" font-weight="800">{{PAGE_TITLE}}</text>
  <text x="70" y="180" fill="#666666" font-family="STKaiti, KaiTi" font-size="22">{{PAGE_SUBTITLE}}</text>
  <line x1="70" y1="204" x2="1210" y2="204" stroke="#E7E6E6" stroke-width="1"/>

  <g id="mechanism-input">
    <rect x="70" y="258" width="304" height="274" rx="6" fill="#F1F8FE"/>
    <rect x="70" y="258" width="304" height="8" fill="#2E75FF"/>
    <text x="100" y="312" fill="#2E75FF" font-family="STKaiti, KaiTi" font-size="20" font-weight="700">INPUT · 输入</text>
    <text x="100" y="365" fill="#262626" font-family="STKaiti, KaiTi" font-size="30" font-weight="700">{{INPUT_TITLE}}</text>
    <line x1="100" y1="390" x2="344" y2="390" stroke="#E7E6E6" stroke-width="1"/>
    <text x="100" y="435" fill="#44546A" font-family="STKaiti, KaiTi" font-size="22">{{INPUT_DATA}}</text>
    <text x="100" y="476" fill="#44546A" font-family="STKaiti, KaiTi" font-size="22">{{INPUT_GOAL}}</text>
  </g>
  <g id="mechanism-model">
    <rect x="488" y="258" width="304" height="274" rx="6" fill="#003396"/>
    <rect x="488" y="258" width="304" height="8" fill="#C7A661"/>
    <text x="518" y="312" fill="#C7A661" font-family="STKaiti, KaiTi" font-size="20" font-weight="700">MODEL · 生成</text>
    <text x="518" y="365" fill="#FFFFFF" font-family="STKaiti, KaiTi" font-size="30" font-weight="700">{{MODEL_TITLE}}</text>
    <line x1="518" y1="390" x2="762" y2="390" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
    <text x="518" y="435" fill="#ECF6FE" font-family="STKaiti, KaiTi" font-size="22">{{MODEL_ACTION}}</text>
    <text x="518" y="476" fill="#ECF6FE" font-family="STKaiti, KaiTi" font-size="22">{{MODEL_LIMIT}}</text>
  </g>
  <g id="mechanism-output">
    <rect x="906" y="258" width="304" height="274" rx="6" fill="#F1F8FE"/>
    <rect x="906" y="258" width="304" height="8" fill="#1F90E0"/>
    <text x="936" y="312" fill="#1F90E0" font-family="STKaiti, KaiTi" font-size="20" font-weight="700">OUTPUT · 输出</text>
    <text x="936" y="365" fill="#262626" font-family="STKaiti, KaiTi" font-size="30" font-weight="700">{{OUTPUT_TITLE}}</text>
    <line x1="936" y1="390" x2="1180" y2="390" stroke="#E7E6E6" stroke-width="1"/>
    <text x="936" y="435" fill="#44546A" font-family="STKaiti, KaiTi" font-size="22">{{OUTPUT_FORM}}</text>
    <text x="936" y="476" fill="#44546A" font-family="STKaiti, KaiTi" font-size="22">{{OUTPUT_RISK}}</text>
  </g>
  <path d="M 394 394 L 464 394" fill="none" stroke="#2E75FF" stroke-width="4"/>
  <path d="M 454 383 L 468 394 L 454 405" fill="none" stroke="#2E75FF" stroke-width="4"/>
  <path d="M 812 394 L 882 394" fill="none" stroke="#2E75FF" stroke-width="4"/>
  <path d="M 872 383 L 886 394 L 872 405" fill="none" stroke="#2E75FF" stroke-width="4"/>

  <g id="human-check-loop">
    <path d="M 1058 548 L 1058 620 L 222 620 L 222 548" fill="none" stroke="#C7A661" stroke-width="3"/>
    <path d="M 211 560 L 222 545 L 233 560" fill="none" stroke="#C7A661" stroke-width="3"/>
    <rect x="444" y="594" width="392" height="54" rx="6" fill="#FFFFFF" stroke="#C7A661" stroke-width="2"/>
    <text x="640" y="629" text-anchor="middle" fill="#003396" font-family="STKaiti, KaiTi" font-size="22" font-weight="700">{{HUMAN_CHECK}}</text>
  </g>
</svg>
