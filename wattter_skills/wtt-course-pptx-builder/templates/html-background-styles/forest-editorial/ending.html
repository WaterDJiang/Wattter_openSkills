<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>forest-editorial / ending</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green-deep: #243a21;
    --green-lite: #3a5a36;
    --cream-2: #e6dcc4;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    color: var(--text);
  }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  /* 左侧森林绿竖色带 */
  .panel-left {
    position: absolute; left: 0; top: 0; width: 14px; height: 100%;
    background: var(--primary);
  }
  /* 顶部双段尘粉色带（收束节奏） */
  .topbar {
    position: absolute; left: 96px; top: 64px; right: 96px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .rule { width: 160px; height: 3px; background: var(--accent); }
  .topbar .rule-short { width: 80px; height: 3px; background: var(--accent); }
  /* 右上森林绿圆形色块（明暗呼应 cover 的 corner-block） */
  .corner-circle {
    position: absolute; right: 96px; top: 168px; width: 120px; height: 120px;
    border-radius: 50%; background: var(--green-deep); opacity: 0.92;
  }
  /* 中段发丝线（分隔 thanks 与 contact） */
  .mid-rule {
    position: absolute; left: 96px; top: 470px; width: 360px; height: 1px;
    background: var(--accent); opacity: 0.5;
  }
  /* 底部发丝线 */
  .footline {
    position: absolute; bottom: 72px; left: 96px; right: 96px;
    height: 1px; background: var(--accent); opacity: 0.6;
  }
  .logo { position: absolute; left: 96px; top: 168px; height: 36px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel-left"></div>
  <div class="corner-circle"></div>
  <div class="topbar">
    <span class="rule"></span>
    <span class="rule-short"></span>
  </div>
  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- text-slot: thanks 96,260 1184,400 -->
  <!-- text-slot: contact 96,500 1184,620 -->
  <div class="mid-rule"></div>
  <div class="footline"></div>
</div>
</body>
</html>
