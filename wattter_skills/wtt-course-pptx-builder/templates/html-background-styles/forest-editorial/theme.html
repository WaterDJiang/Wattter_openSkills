<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>forest-editorial / theme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green-deep: #243a21;
    --green-lite: #3a5a36;
    --cream-2: #e6dcc4;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    color: var(--text);
  }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  /* 左侧森林绿竖色带（全 deck 一致的结构锚） */
  .panel-left {
    position: absolute; left: 0; top: 0; width: 14px; height: 100%;
    background: var(--primary);
  }
  /* 顶部尘粉发丝线 */
  .top-rule {
    position: absolute; left: 96px; top: 64px; right: 96px;
    height: 1px; background: var(--accent); opacity: 0.5;
  }
  /* 顶部尘粉小圆点（章节连续性标记） */
  .top-dot {
    position: absolute; left: 96px; top: 58px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
  }
  /* 底部发丝线 */
  .footline {
    position: absolute; bottom: 56px; left: 96px; right: 96px;
    height: 1px; background: var(--accent); opacity: 0.4;
  }
  /* 内容区背景留白 — theme 无 text-slot，Executor 自由设计内容层 */
  .logo { position: absolute; left: 96px; top: 88px; height: 28px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel-left"></div>
  <div class="top-dot"></div>
  <div class="top-rule"></div>
  <img class="logo" src="{{logo_href}}" alt="" />
  <div class="footline"></div>
</div>
</body>
</html>
