<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>forest-editorial / cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* 风格固定色（DNA — 不被色板覆盖） */
    --green-deep: #243a21;
    --green-lite: #3a5a36;
    --cream-2: #e6dcc4;
    /* 主题角色（{{var}} 覆盖；不传 = 原生林间色） */
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    color: var(--text);
  }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  /* 左侧森林绿竖色带（结构锚） */
  .panel-left {
    position: absolute; left: 0; top: 0; width: 14px; height: 100%;
    background: var(--primary);
  }
  /* 顶部 topbar：尘粉短色带 + 圆形 mark 描边（纯几何，不烘焙文字） */
  .topbar {
    position: absolute; left: 96px; top: 64px; right: 96px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .rule {
    width: 220px; height: 3px; background: var(--accent);
  }
  .topbar .mark {
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid var(--accent);
  }
  /* 底部 footline：尘粉发丝线（不烘焙文字） */
  .footline {
    position: absolute; bottom: 72px; left: 96px; right: 96px;
    height: 1px; background: var(--accent); opacity: 0.6;
  }
  /* 右下角森林绿装饰色块（明暗混排节奏） */
  .corner-block {
    position: absolute; right: 0; bottom: 0; width: 280px; height: 180px;
    background: var(--green-deep); opacity: 0.92;
  }
  .logo { position: absolute; left: 96px; top: 168px; height: 36px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel-left"></div>
  <div class="corner-block"></div>
  <div class="topbar">
    <span class="rule"></span>
    <div class="mark"></div>
  </div>
  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- text-slot: title 96,250 1184,360 -->
  <!-- text-slot: subtitle 96,385 1184,440 -->
  <!-- text-slot: author 96,610 640,650 -->
  <!-- text-slot: date 660,610 1184,650 -->
  <div class="footline"></div>
</div>
</body>
</html>
