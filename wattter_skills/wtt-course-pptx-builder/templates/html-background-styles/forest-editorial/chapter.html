<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>forest-editorial / chapter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green-deep: #243a21;
    --green-lite: #3a5a36;
    --cream-2: #e6dcc4;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    color: var(--text);
  }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  /* 左侧森林绿竖色带 */
  .panel-left {
    position: absolute; left: 0; top: 0; width: 14px; height: 100%;
    background: var(--primary);
  }
  /* 顶部尘粉短色带 + 圆点（章节标记） */
  .topbar {
    position: absolute; left: 96px; top: 64px; right: 96px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topbar .rule { width: 180px; height: 3px; background: var(--accent); }
  .topbar .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  /* 右侧森林绿大色块（章节页的视觉重量） */
  .side-block {
    position: absolute; right: 0; top: 0; width: 320px; height: 100%;
    background: var(--green-deep); opacity: 0.92;
  }
  /* 右侧色块上的尘粉竖发丝线 */
  .side-rule {
    position: absolute; right: 288px; top: 96px; width: 1px; height: 528px;
    background: var(--accent); opacity: 0.7;
  }
  /* 底部发丝线 */
  .footline {
    position: absolute; bottom: 72px; left: 96px; right: 96px;
    height: 1px; background: var(--accent); opacity: 0.6;
  }
  .logo { position: absolute; left: 96px; top: 110px; height: 32px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel-left"></div>
  <div class="side-block"></div>
  <div class="side-rule"></div>
  <div class="topbar">
    <span class="rule"></span>
    <span class="dot"></span>
  </div>
  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- text-slot: chapter_num 96,200 880,400 -->
  <!-- text-slot: chapter_name 96,440 880,520 -->
  <div class="footline"></div>
</div>
</body>
</html>
