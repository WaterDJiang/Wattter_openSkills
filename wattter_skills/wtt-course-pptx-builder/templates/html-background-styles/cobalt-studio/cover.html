<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;800&display=swap" rel="stylesheet">
<title>cobalt-studio / cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --near-black: #0a0a0a;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Manrope", "Inter", system-ui, sans-serif;
    color: var(--text);
  }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  /* 上半 50%：白色 panel */
  .panel-top {
    position: absolute; left: 0; top: 0; width: 100%; height: 50%;
    background: var(--bg);
  }
  /* 中间 9px 黑色 edge bar（钴蓝工作室签名 device） */
  .edge-bar {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 100%; height: 9px; background: var(--near-black);
  }
  /* 下半 50%：钴蓝 panel */
  .panel-bottom {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 50%;
    background: var(--primary);
    color: #fff;
  }
  /* 品牌 marks 4 角 */
  .mark {
    position: absolute; z-index: 6;
    font-size: 13px; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .mark .chip {
    width: 10px; height: 10px; background: var(--primary); display: inline-block;
  }
  .mark .soft { color: rgba(255,255,255,0.72); font-weight: 500; }
  .mark-tl { top: 28px; left: 40px; color: var(--text); }
  .mark-tl .soft { color: rgba(10,10,10,0.58); font-weight: 500; }
  .mark-tr { top: 28px; right: 40px; color: var(--text); }
  .mark-tr .soft { color: rgba(10,10,10,0.58); font-weight: 500; }
  .mark-bl { bottom: 24px; left: 40px; color: #fff; }
  .mark-br { bottom: 24px; right: 40px; color: #fff; }
  .logo { position: absolute; left: 40px; top: 60px; height: 24px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="panel-top"></div>
  <div class="edge-bar"></div>
  <div class="panel-bottom"></div>

  <div class="mark mark-tl"><span class="chip"></span>Brand</div>
  <div class="mark mark-tr"><span class="soft">No Sign-up</span></div>
  <div class="mark mark-bl"><span class="soft">Cobalt Studio</span></div>
  <div class="mark mark-br">01 / 10</div>

  <img class="logo" src="{{logo_href}}" alt="" />

</div>
</body>
</html>
