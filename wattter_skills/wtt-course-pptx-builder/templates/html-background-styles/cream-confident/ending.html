<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>cream-confident / ending</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #EFE9D9;
    --cream-2: #E4DCC4;
    --green: #1F8A4C;
    --pink: #F06CA8;
    --orange: #E85A1F;
    --yellow: #F5C518;
    --ink: #0F0F0F;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body { background: var(--green); color: var(--cream); font-family: "Space Grotesk", system-ui, sans-serif; }
  .canvas { position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; background: var(--green); }
  .topbar {
    position: absolute; left: 50px; right: 50px; top: 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--cream);
  }
  .pill { border: 2px solid var(--cream); padding: 4px 12px; border-radius: 999px; }
  /* 旋转的粉色圆形 stamp（neobrutalism 收束 device） */
  .stamp {
    position: absolute; right: 80px; bottom: 100px;
    width: 200px; height: 200px; background: var(--pink);
    border: 4px solid var(--cream);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-6deg);
  }
  .stamp .inner {
    width: 160px; height: 160px; border: 4px solid var(--cream); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 12px;
  }
  .stamp .num { font-family: "Archivo Black", sans-serif; font-size: 36px; line-height: .9; }
  .stamp .lbl { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .slide-meta {
    position: absolute; left: 50px; right: 50px; bottom: 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--cream);
  }
  .slide-meta .dot { width: 6px; height: 6px; background: var(--cream); border-radius: 50%; display: inline-block; margin: 0 8px; transform: translateY(-1px); }
  .logo { position: absolute; left: 50px; top: 56px; height: 22px; width: auto; filter: brightness(0) invert(1); }
</style>
</head>
<body>
<div class="canvas">
  <div class="topbar">
    <span>END OF DECK</span>
    <span class="pill">FIN.</span>
  </div>

  <div class="stamp">
    <div class="inner">
      <div class="num">10/10</div>
      <div class="lbl">FIN.</div>
    </div>
  </div>

  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- text-slot: thanks 50,180 700,460 -->
  <!-- text-slot: contact 50,500 800,620 -->

  <div class="slide-meta">
    <span>CLOSING CARD</span>
    <span>10 <span class="dot"></span> 10</span>
  </div>
</div>
</body>
</html>
