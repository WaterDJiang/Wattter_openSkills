<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<title>cream-confident / theme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #EFE9D9;
    --cream-2: #E4DCC4;
    --green: #1F8A4C;
    --pink: #F06CA8;
    --orange: #E85A1F;
    --yellow: #F5C518;
    --ink: #0F0F0F;
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --text: {{text}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body { background: var(--cream); color: var(--ink); font-family: "Space Grotesk", system-ui, sans-serif; }
  .canvas { position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; background: var(--cream); }
  .topbar {
    position: absolute; left: 50px; right: 50px; top: 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .pill { border: 2px solid var(--ink); padding: 4px 12px; border-radius: 999px; }
  /* 4 个撞色色块散布作装饰（绿/粉/橙/黄，无功能） */
  .block {
    position: absolute; border: 4px solid var(--ink);
  }
  .block-1 { width: 180px; height: 120px; background: var(--green); top: 130px; right: 80px; transform: rotate(-3deg); }
  .block-2 { width: 140px; height: 100px; background: var(--pink); top: 280px; right: 240px; transform: rotate(2deg); }
  .block-3 { width: 160px; height: 100px; background: var(--yellow); bottom: 180px; right: 130px; transform: rotate(-2deg); }
  .block-4 { width: 120px; height: 120px; background: var(--orange); bottom: 200px; right: 400px; transform: rotate(4deg); }
  .slide-meta {
    position: absolute; left: 50px; right: 50px; bottom: 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  }
  .slide-meta .dot { width: 6px; height: 6px; background: var(--ink); border-radius: 50%; display: inline-block; margin: 0 8px; transform: translateY(-1px); }
  .logo { position: absolute; left: 50px; top: 56px; height: 22px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="topbar">
    <span>CREAM · CONFIDENT EDITION</span>
    <span class="pill">THEME</span>
  </div>

  <div class="block block-1"></div>
  <div class="block block-2"></div>
  <div class="block block-3"></div>
  <div class="block block-4"></div>

  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- theme 无 text-slot，Executor 自由设计内容层 -->

  <div class="slide-meta">
    <span>THEME · CONTENT</span>
    <span>00 <span class="dot"></span> 10</span>
  </div>
</div>
</body>
</html>
