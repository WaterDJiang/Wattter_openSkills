<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>editorial-rule / chapter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: {{primary}};
    --accent: {{accent}};
    --bg: {{bg}};
    --surface: {{surface}};
    --border: {{border}};
  }
  html, body { width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden; }
  body { background: var(--bg); }
  .canvas {
    position: relative; width: {{canvas_w}}px; height: {{canvas_h}}px; overflow: hidden;
    background: var(--bg);
  }
  .top-band { position: absolute; left: 0; top: 0; right: 0; height: 14px; background: var(--primary); }
  /* chapter_num 上方 accent 发丝线 */
  .accent-rule {
    position: absolute; left: 80px; top: 175px; width: 96px; height: 4px;
    background: var(--accent);
  }
  /* chapter_name 上方 border 发丝线 */
  .divider-rule {
    position: absolute; left: 80px; right: 80px; top: 398px; height: 1px;
    background: var(--border);
  }
  .logo { position: absolute; right: 80px; top: 56px; height: 40px; width: auto; }
</style>
</head>
<body>
<div class="canvas">
  <div class="top-band"></div>
  <div class="accent-rule"></div>
  <div class="divider-rule"></div>
  <img class="logo" src="{{logo_href}}" alt="" />
  <!-- text-slot: chapter_num 80,200 460,380 -->
  <!-- text-slot: chapter_name 80,420 1200,490 -->
</div>
</body>
</html>
