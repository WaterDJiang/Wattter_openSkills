<head>

*{box-sizing:border-box}body{margin:0;background:#151f33;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;color:white;display:grid;place-items:center;min-height:100vh}#stage{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}#controls{position:fixed;bottom:10px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#19263deb;border-radius:30px}button{border:0;border-radius:16px;padding:7px 16px;background:#f29b58}input{width:32vw}.export #controls{display:none}

<canvas id="stage"></canvas><div id="controls"><button id="play">播放</button><input id="seek" type="range" aria-label="时间" min="0" value="0" step="1"><span id="time"></span></div>
<audio id="audio" preload="none"></audio>
<script src="scenes.js"></script><script src="runtime.js"></script>
